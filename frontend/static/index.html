<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thistle & Page</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#6b3fa0; --accent-hover:#553082; --bg:#f8f7fa; --border:#e2d9ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  header { background:var(--accent); color:#fff; padding:0.8rem 1.4rem; font-weight:700; font-size:1.15rem; letter-spacing:0.02em; display:flex; align-items:center; gap:0.6rem; box-shadow:0 2px 6px rgba(107,63,160,0.15); }
  header span.subtitle { font-size:0.85rem; font-weight:400; opacity:0.85; margin-left:0.5rem; }
  .user-badge { margin-left:auto; display:flex; align-items:center; gap:0.5rem; background:rgba(255,255,255,0.18); padding:0.35rem 0.75rem; border-radius:20px; font-size:0.85rem; font-weight:500; cursor:pointer; transition:background 0.15s ease; border:1px solid rgba(255,255,255,0.3); }
  .user-badge:hover { background:rgba(255,255,255,0.28); }
  .user-badge span.switch-hint { font-size:0.75rem; opacity:0.85; text-decoration:underline; margin-left:0.2rem; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(2px); }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#fff; border-radius:14px; width:90%; max-width:440px; padding:1.5rem; box-shadow:0 12px 30px rgba(0,0,0,0.2); animation:popIn 0.18s ease-out; }
  @keyframes popIn { from { transform:scale(0.95); opacity:0; } to { transform:scale(1); opacity:1; } }
  .modal-title { font-size:1.15rem; font-weight:700; color:#3b1e5a; margin-top:0; margin-bottom:0.4rem; }
  .modal-desc { font-size:0.85rem; color:#6b5f79; margin-bottom:1rem; }
  .profile-list { display:flex; flex-direction:column; gap:0.6rem; margin-bottom:1.2rem; }
  .profile-card { border:1px solid var(--border); border-radius:10px; padding:0.75rem 0.9rem; display:flex; align-items:center; gap:0.75rem; cursor:pointer; transition:all 0.15s ease; }
  .profile-card:hover { border-color:var(--accent); background:#faf7fd; }
  .profile-card.active { border-color:var(--accent); background:#f3ecf8; box-shadow:0 0 0 1px var(--accent); }
  .profile-avatar { font-size:1.5rem; line-height:1; }
  .profile-info { flex:1; }
  .profile-name { font-weight:600; font-size:0.95rem; color:#3b1e5a; }
  .profile-loc { font-size:0.8rem; color:#6b5f79; }
  .modal-actions { display:flex; justify-content:flex-end; gap:0.5rem; }
  .btn-secondary { background:#e9e3f0; color:#4a2b6d; padding:0.55rem 1rem; border-radius:6px; font-weight:600; font-size:0.85rem; border:none; cursor:pointer; }
  .btn-secondary:hover { background:#ded5e8; }
</style>
</head>
<body>
<header>
  <span>🌿 Thistle &amp; Page</span>
  <span class="subtitle">San Mateo County Lending</span>
  <div class="user-badge" id="readerBadge" title="Click to switch reader identity">
    <span id="badgeAvatar">👤</span>
    <span id="badgeName">Elena R. (Baywood)</span>
    <span class="switch-hint">Switch</span>
  </div>
</header>

<div class="modal-overlay" id="profileModal">
  <div class="modal-box">
    <h3 class="modal-title">Select Reader Profile</h3>
    <p class="modal-desc">Switch between verified San Mateo community readers to verify isolated active shelves and borrowing records.</p>
    <div class="profile-list" id="profileList"></div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="closeModalBtn">Cancel</button>
    </div>
  </div>
</div>

<div id="log"></div>
<div class="prompt-row" id="chips">
  <button type="button" class="chip" data-prompt="Who am I and what is currently on my active lending shelf and hold schedule?">👤 Who am I & my shelf</button>
  <button type="button" class="chip" data-prompt="Find available copies of Dune across San Mateo County library branches.">📚 Check library holds for Dune</button>
  <button type="button" class="chip" data-prompt="Search our neighborhood community shelf in San Mateo for cozy books or reading gear.">🏡 Browse neighborhood shelf</button>
  <button type="button" class="chip" data-prompt="Show my active library holds and neighbor loan return schedule.">📅 View my lending schedule</button>
  <button type="button" class="chip" data-prompt="Find a cozy rainy-day read with warm tea vibes within walking distance (under 1 mile).">🍵 Cozy rainy-day read (<1 mi)</button>
  <button type="button" class="chip" data-prompt="List a cozy book 'The House in the Cerulean Sea' from San Mateo Central Park and illustrate a custom bookmark for it.">🎨 List book & create bookmark</button>
</div>
<form id="form">
  <input id="input" placeholder="Search books, library holds, or local gear in San Mateo…" autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Button": {
      const btn = el("button", "a2btn");
      btn.type = "button";
      const label = boundStr(props.label || props.text || (props.action && props.action.label) || "Action");
      btn.textContent = label;
      const childNodes = kids();
      if (childNodes.length > 0) {
        btn.textContent = "";
        childNodes.forEach(n => btn.appendChild(n));
      }
      const actionText = boundStr(props.action || props.onClick || props.value || label);
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        sendPrompt(actionText);
      });
      return btn;
    }
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

/* ----------------------------------------------------------------------------
 * Lightweight Authentication & Reader Identity Management
 * -------------------------------------------------------------------------- */
let currentProfile = {
  user_id: "elena_baywood",
  name: "Elena R.",
  neighborhood: "Baywood, San Mateo",
  avatar: "🌿"
};
let sessionToken = localStorage.getItem("reader_token") || "";

const badgeEl = document.getElementById("readerBadge");
const badgeAvatar = document.getElementById("badgeAvatar");
const badgeName = document.getElementById("badgeName");
const profileModal = document.getElementById("profileModal");
const profileList = document.getElementById("profileList");
const closeModalBtn = document.getElementById("closeModalBtn");

function updateBadgeUI() {
  badgeAvatar.textContent = currentProfile.avatar || "👤";
  badgeName.textContent = `${currentProfile.name} (${currentProfile.neighborhood.split(',')[0]})`;
}

async function loginAsProfile(profile) {
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(profile)
    });
    const data = await res.json();
    sessionToken = data.token;
    localStorage.setItem("reader_token", sessionToken);
    currentProfile = {
      user_id: data.user_id,
      name: data.name,
      neighborhood: data.neighborhood,
      avatar: profile.avatar || "👤"
    };
    localStorage.setItem("reader_profile", JSON.stringify(currentProfile));
    updateBadgeUI();
  } catch (err) {
    console.error("Login failed:", err);
  }
}

async function loadProfiles() {
  try {
    const res = await fetch("/api/auth/profiles");
    const data = await res.json();
    profileList.textContent = "";
    (data.profiles || []).forEach(p => {
      const card = el("div", "profile-card" + (p.user_id === currentProfile.user_id ? " active" : ""));
      const av = el("div", "profile-avatar", p.avatar || "👤");
      const info = el("div", "profile-info");
      const name = el("div", "profile-name", p.name);
      const loc = el("div", "profile-loc", `${p.neighborhood} • ${p.bio}`);
      info.appendChild(name);
      info.appendChild(loc);
      card.appendChild(av);
      card.appendChild(info);

      card.addEventListener("click", async () => {
        await loginAsProfile(p);
        profileModal.classList.remove("open");
        bubble("agent").textContent = `Switched active reader to ${p.name} (${p.neighborhood}). Your active shelf, holds, and borrowing sessions are now scoped to your account.`;
      });
      profileList.appendChild(card);
    });
  } catch (err) {
    console.error("Failed to load profiles:", err);
  }
}

// Initialize session
try {
  const saved = localStorage.getItem("reader_profile");
  if (saved) currentProfile = JSON.parse(saved);
} catch (e) {}
updateBadgeUI();
loginAsProfile(currentProfile);

badgeEl.addEventListener("click", () => {
  loadProfiles();
  profileModal.classList.add("open");
});
closeModalBtn.addEventListener("click", () => {
  profileModal.classList.remove("open");
});

async function sendPrompt(text) {
  const query = (text || "").trim();
  if (!query) return;
  bubble("user").textContent = query;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const headers = { "Content-Type": "application/json" };
    if (sessionToken) {
      headers["Authorization"] = `Bearer ${sessionToken}`;
    }
    const res = await fetch("/chat", {
      method: "POST",
      headers,
      body: JSON.stringify({
        message: query,
        user_id: currentProfile.user_id,
        token: sessionToken
      })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  sendPrompt(input.value);
});

// Example prompt chips
document.querySelectorAll(".chip").forEach((btn) => {
  btn.addEventListener("click", () => {
    sendPrompt(btn.getAttribute("data-prompt"));
  });
});
</script>
</body>
</html>
